name: Release — 补发历史版本安装包

# 用途：为库里已存在、但从未产出安装包的旧 tag 补发 GitHub Release。
# 背景：v0.1.0 时仓库还没有本工作流；v0.2.0 的 release.yml 依赖 package:ci 脚本（当时不存在），
#       且 v0.2.0 的 artifactName 为非 ASCII，会导致 electron-updater 下载 404。
# 做法：checkout 指定 tag 的源码，但用当前规范的打包配置覆盖，保证产物命名与自动更新源一致。
# 重要：旧 tag（v0.1.1~v0.1.6）实际指向 package.json 为 0.2.0~0.5.0 的历史 commit，
#       历史中并不存在 0.1.1~0.1.6 版本。故打包时强制以 tag 名推导版本号（v0.1.1→0.1.1）注入，
#       使产物文件名为 gale-engine-0.1.x-setup.exe，与 tag 对齐。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要补发的 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write    # 供 softprops/action-gh-release 创建 / 更新 Release

concurrency:
  group: release-backfill-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: 补发 ${{ inputs.tag }} (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout 指定 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        # 历史 tag 的 lockfile 与当前 Node 版本可能存在解析差异，
        # 用 install 而非 ci，容忍 lockfile 漂移。
        run: npm install --no-audit --no-fund
        env:
          # 加速 Electron 二进制下载（GitHub Runner 直连亦可，此处仅提速）
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/

      - name: 覆盖为规范打包配置（强制版本对齐 tag）
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          # 从 tag（如 v0.1.1）推导纯版本号 0.1.1，强制用于打包，
          # 以覆盖旧 commit 里错位的 package.json 版本
          #（v0.1.1~v0.1.6 的 tag 实际指向 0.2.0~0.5.0 的 commit，历史中并无 0.1.1~0.1.6 版本）。
          VERSION="${TAG_NAME#v}"
          cat > electron-builder.yml <<'EOF'
          appId: com.galeengine.app
          productName: 疾风引擎
          directories:
            output: release
          files:
            - out/**
            - package.json
          electronLanguages:
            - zh-CN
          compression: maximum
          # 注意：electron-builder 配置不接受顶层 version 字段（schema 校验会失败）。
          # 版本号统一由下方 sed 写入 package.json 后由工具链自动读取。
          win:
            target:
              - target: nsis
                arch:
                  - x64
          nsis:
            oneClick: false
            allowToChangeInstallationDirectory: true
            artifactName: gale-engine-VERSION_PLACEHOLDER-setup.exe
          publish:
            - provider: github
              owner: OWNER_PLACEHOLDER
              repo: REPO_PLACEHOLDER
          EOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" electron-builder.yml
          sed -i "s/OWNER_PLACEHOLDER/${REPO_OWNER}/" electron-builder.yml
          sed -i "s/REPO_PLACEHOLDER/${REPO_NAME}/" electron-builder.yml
          # 同步修正 package.json 的 version，使应用内部版本号与安装包/更新源一致
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          echo "--- 生效的打包配置 ---"
          cat electron-builder.yml
          echo "--- package.json version ---"
          grep '"version"' package.json

      - name: 构建并打包安装包
        shell: bash
        env:
          # 国内镜像拉取 winCodeSign / nsis / nsis-resources（结尾斜杠不可省）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://cdn.npmmirror.com/binaries/electron-builder-binaries/
        # 不使用 package.json 的脚本：v0.1.0 / v0.2.0 尚无 package:ci，
        # 这里直接调用工具链，对全部历史 tag 通用。
        # --publish never：发布统一交给下方 gh-release 步骤，避免 electron-builder
        # 在 CI 环境自行发布时因缺 GH_TOKEN 失败。
        run: |
          npx electron-vite build
          npx electron-builder --win --publish never
          echo "--- 产物 ---"
          ls -la release/

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          # latest.yml 必须上传：electron-updater 依赖它检查与下载新版本
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
