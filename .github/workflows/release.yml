name: Release — 打 tag 触发多平台多架构构建与发布

on:
  push:
    tags:
      - 'v*'          # 例如 v0.1.0 / v0.2.0，推送 tag 即触发

permissions:
  contents: write    # 供 softprops/action-gh-release 创建 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false      # 单平台失败不取消其他平台，便于定位
      matrix:
        include:
          # Windows x64
          - os: windows
            runner: windows-latest
            arch: x64
            target: --win
          # Windows ARM64（在 x64 runner 上交叉编译）
          - os: windows
            runner: windows-latest
            arch: arm64
            target: --win
          # macOS x64（Intel）— 在 macos-latest(arm64) runner 上通过 Rosetta 2 交叉编译，
          # 避免 macos-13 Intel runner 长时间排队。
          - os: macos
            runner: macos-latest
            arch: x64
            target: --mac
          # macOS ARM64（Apple Silicon，原生 runner 更快）
          - os: macos
            runner: macos-latest
            arch: arm64
            target: --mac
          # Linux x64
          - os: linux
            runner: ubuntu-latest
            arch: x64
            target: --linux
          # Linux ARM64（在 x64 runner 上交叉编译，需 qemu/binfmt）
          - os: linux
            runner: ubuntu-latest
            arch: arm64
            target: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux ARM64 交叉编译前置（qemu + icnsutils）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support icnsutils

      - name: 安装依赖
        run: npm ci

      - name: 注入仓库信息到自动更新配置
        shell: pwsh
        run: |
          $owner = '${{ github.repository_owner }}'
          $repo = '${{ github.event.repository.name }}'
          $content = Get-Content electron-builder.yml -Raw
          $content = $content -replace 'YOUR_GITHUB_OWNER', $owner
          $content = $content -replace 'repo: gale-engine', "repo: $repo"
          Set-Content electron-builder.yml $content -NoNewline
          Select-String -Path electron-builder.yml -Pattern 'owner:|repo:'

      - name: 构建并打包安装包
        shell: bash
        env:
          # 国内镜像拉取 winCodeSign / nsis / nsis-resources（结尾斜杠不可省）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://cdn.npmmirror.com/binaries/electron-builder-binaries/
          CODEBUDDY_SAFE_DELETE_ENABLED: 0
          # 代码签名（休眠态）：仓库设置 Secrets 后 CI 自动签名，未配置则跳过。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 公证（需 Apple Developer 账号，未配置则仅签名不公证）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --publish never：各 matrix job 只构建不发布，产物由 release job 统一上传
        run: npx electron-vite build && npx electron-builder ${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: 整理构建产物（按 os-arch 分目录，避免跨 matrix 同名文件覆盖）
        shell: bash
        run: |
          SUBDIR=release/${{ matrix.os }}-${{ matrix.arch }}
          mkdir -p "$SUBDIR"
          shopt -s nullglob
          # 移动所有构建产物到对应子目录，排除 builder-debug.yml（调试用，不发布）
          for f in release/*.exe release/*.exe.blockmap release/*.dmg release/*.dmg.blockmap \
                   release/*.AppImage release/*.AppImage.zsync release/*.deb; do
            mv "$f" "$SUBDIR/"
          done
          # latest*.yml 需要特殊处理：Windows arm64 生成的 latest.yml 会与 x64 的重名，
          # 重命名为 latest-arm64.yml 以区分；x64 保持 latest.yml（electron-updater 默认查找）
          for f in release/latest*.yml; do
            fname=$(basename "$f")
            if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ] && [ "$fname" = "latest.yml" ]; then
              mv "$f" "$SUBDIR/latest-arm64.yml"
            else
              mv "$f" "$SUBDIR/"
            fi
          done
          echo "=== ${{ matrix.os }}-${{ matrix.arch }} 产物列表 ==="
          ls -la "$SUBDIR/"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: release/${{ matrix.os }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

  # 统一发布 job：等所有 build job 完成后，下载全部产物一次性上传到同一 Release，
  # 避免并行 matrix job 同时更新 release asset 导致的 404 竞态错误。
  release:
    name: 发布到 GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          # 不用 merge-multiple：每个 artifact 下载到自己的子目录（release-windows-x64/ 等），
          # 彻底避免跨平台同名文件（如 latest.yml、builder-debug.yml）互相覆盖。
          merge-multiple: false

      - name: 扁平化并列出待发布文件
        run: |
          mkdir -p dist
          # 每个 artifact 下载到自己的子目录（release-windows-x64/ 等），这里把所有文件扁平化到 dist/
          # 由于 build job 已经处理了 latest.yml 重命名（Windows arm64 → latest-arm64.yml），不会有冲突
          for d in release-artifacts/*/; do
            cp "$d"* dist/ 2>/dev/null || true
          done
          echo "=== 待发布文件 ($(ls dist/ | wc -l) 个) ==="
          ls -lh dist/

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
