name: Release — 打 tag 触发 Windows 安装包构建与发布

on:
  push:
    tags:
      - 'v*'          # 例如 v0.1.0 / v0.2.0，推送 tag 即触发

permissions:
  contents: write    # 供 softprops/action-gh-release 创建 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: 构建 NSIS 安装包 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建并打包安装包
        shell: cmd
        env:
          # 国内镜像拉取 winCodeSign / nsis / nsis-resources（结尾斜杠不可省）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://cdn.npmmirror.com/binaries/electron-builder-binaries/
          # 避免某些 CI 环境下的安全删除拦截
          CODEBUDDY_SAFE_DELETE_ENABLED: 0
        run: call npm run package

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # 自动从 tag 消息 / 提交生成发布说明
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
