name: Release — 打 tag 触发 Windows 安装包构建与发布

on:
  push:
    tags:
      - 'v*'          # 例如 v0.1.0 / v0.2.0，推送 tag 即触发

permissions:
  contents: write    # 供 softprops/action-gh-release 创建 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: 构建 NSIS 安装包 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 注入仓库信息到自动更新配置
        shell: pwsh
        run: |
          # electron-builder.yml 中 publish.owner 为本地占位符 YOUR_GITHUB_OWNER。
          # CI 里用真实仓库 owner / repo 替换，确保嵌入安装包的 app-update.yml
          # 指向本仓库的 GitHub Releases，应用内「检查更新」才能正常工作。
          $owner = '${{ github.repository_owner }}'
          $repo = '${{ github.event.repository.name }}'
          $content = Get-Content electron-builder.yml -Raw
          $content = $content -replace 'YOUR_GITHUB_OWNER', $owner
          $content = $content -replace 'repo: gale-engine', "repo: $repo"
          Set-Content electron-builder.yml $content -NoNewline
          Select-String -Path electron-builder.yml -Pattern 'owner:|repo:'

      - name: 构建并打包安装包
        shell: cmd
        env:
          # 国内镜像拉取 winCodeSign / nsis / nsis-resources（结尾斜杠不可省）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://cdn.npmmirror.com/binaries/electron-builder-binaries/
          # 避免某些 CI 环境下的安全删除拦截
          CODEBUDDY_SAFE_DELETE_ENABLED: 0
          # 代码签名（休眠态）：仓库设置 Secrets 后 CI 自动签名，未配置则跳过签名。
          #   CSC_LINK        = .pfx/.p12 证书（可填 base64 或仓库内相对路径，需用 Secrets 加密）
          #   CSC_KEY_PASSWORD= 证书导出密码
          # 详见 docs/CODE_SIGNING.md。两项为空时 electron-builder 不签名（当前默认）。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # package:ci 使用 --publish never：CI=true 环境下 electron-builder 会尝试
        # 自行发布（需 GH_TOKEN，未映射必然失败）；发布统一交给下方 gh-release 步骤。
        run: call npm run package:ci

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # 自动从 tag 消息 / 提交生成发布说明
          generate_release_notes: true
          # latest.yml 必须上传：electron-updater 依赖它检查与下载新版本，缺失则应用内更新 404
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
