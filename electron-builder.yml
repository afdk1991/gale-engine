appId: com.galeengine.app
productName: 疾风引擎
directories:
  output: release
files:
  - out/**
  - package.json
electronLanguages:
  - zh-CN
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
  # 代码签名：构建时设置环境变量即自动签名（无需改本文件）——
  #   CSC_LINK=<证书 p12 文件路径或 base64>、CSC_KEY_PASSWORD=<证书密码>
  # 无证书时跳过签名（当前状态），Windows SmartScreen 会提示"未知发布者"，属预期。
  # 图标：默认取 build/icon.ico（由 scripts/generate-icon.mjs 生成，可复现）。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 必须用 ASCII 文件名：electron-builder 在 latest.yml 中对非 ASCII artifactName
  # 会生成净化名（gale-engine-setup-x.y.z.exe），与实际产物名不一致会导致
  # electron-updater 下载 404。安装界面展示名仍取 productName（疾风引擎）。
  artifactName: gale-engine-${version}-setup.exe

# 自动更新源：指向 GitHub Releases（.github/workflows/release.yml 在打 v* tag 时自动发布）。
# 发布前请将 owner 改为你的 GitHub 用户名 / 组织；repo 与仓库名一致即可。
# 应用内「设置 → 检查更新」会读取此配置（嵌入的 resources/app-update.yml）。
publish:
  - provider: github
    owner: YOUR_GITHUB_OWNER
    repo: gale-engine
