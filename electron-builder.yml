appId: com.galeengine.app
productName: 疾风引擎
directories:
  output: release
files:
  - out/**
  - package.json
electronLanguages:
  - zh-CN
compression: maximum

# ── Windows ───────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64          # Windows on ARM 原生支持（Win10/11 ARM 设备）
  # 代码签名：由环境变量驱动，无需改本文件。
  #   CSC_LINK=<证书 .pfx/.p12 路径或 base64>、CSC_KEY_PASSWORD=<证书密码>
  # 两项为空时 electron-builder 自动跳过签名（当前默认），SmartScreen 提示"未知发布者"，属预期。
  # CI 中由 .github/workflows/release.yml 注入 secrets.CSC_LINK / secrets.CSC_KEY_PASSWORD 实现自动签名。
  # forceCodeSigning=false：保证无证书时本地/CI 仍能产出未签名安装包，不因缺失证书而构建失败。
  forceCodeSigning: false
  # 图标：默认取 build/icon.ico（由 scripts/generate-icon.mjs 生成，可复现）。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 必须用 ASCII 文件名：electron-builder 在 latest.yml 中对非 ASCII artifactName
  # 会生成净化名（gale-engine-setup-x.y.z.exe），与实际产物名不一致会导致
  # electron-updater 下载 404。安装界面展示名仍取 productName（疾风引擎）。
  artifactName: gale-engine-${version}-${arch}-setup.exe

# ── macOS ─────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64         # Apple Silicon（M1/M2/M3/M4）原生
  category: public.app-category.utilities
  # 签名与公证：配置 Apple Developer 证书后由 CI 自动签名（CSC_LINK/CSC_KEY_PASSWORD 同 Win 复用）。
  # 公证需额外设置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 环境变量。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: gale-engine-${version}-${arch}.${ext}

# ── Linux ─────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64        # 树莓派 / ARM 服务器 / ARM Linux 工作站
    - target: deb
      arch:
        - x64
  category: Utility
  maintainer: afdk1991
  vendor: GaleEngine
  artifactName: gale-engine-${version}-${arch}.${ext}

# 自动更新源：指向 GitHub Releases（.github/workflows/release.yml 在打 v* tag 时自动发布）。
# 应用内「设置 → 检查更新」会读取此配置（嵌入的 resources/app-update.yml）。
# 注意：跨平台更新需为每个 OS+架构 产出独立的 latest.yml（CI 矩阵构建会自动处理）。
publish:
  - provider: github
    owner: afdk1991
    repo: gale-engine
